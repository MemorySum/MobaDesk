name: Build Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Show build context
        shell: pwsh
        run: |
          git log -1 --oneline
          Write-Host "ref=$env:GITHUB_REF sha=$env:GITHUB_SHA"

      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          $url = 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe'
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.4.exe'
          Invoke-WebRequest -Uri $url -OutFile $installer
          $signature = Get-AuthenticodeSignature -FilePath $installer
          if ($signature.Status -ne 'Valid') {
            throw "Inno Setup signature check failed: $($signature.Status)"
          }
          Start-Process -FilePath $installer -Wait -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/NOICONS'
          )

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content src/MobaDesk/MobaDesk.csproj -Encoding UTF8
          $version = ($project.Project.PropertyGroup.Version |
            Where-Object { $_ } | Select-Object -First 1)
          if (-not $version) { throw 'Version not found in src/MobaDesk/MobaDesk.csproj' }

          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $tag = $env:GITHUB_REF_NAME.TrimStart('v')
            if ($tag -ne $version) {
              throw "Tag '$($env:GITHUB_REF_NAME)' does not match <Version>$version</Version>."
            }
          }

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "MobaDesk version: $version"

      - name: Build installer
        shell: pwsh
        run: ./installer/build-installer.ps1 -Version '${{ steps.version.outputs.version }}'

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MobaDesk-Setup-${{ steps.version.outputs.version }}
          path: |
            installer/output/MobaDesk-Setup-*.exe
            installer/output/version.json
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer/output/MobaDesk-Setup-*.exe
            installer/output/version.json
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            MobaDesk ${{ steps.version.outputs.version }} installer and update manifest.

            Update feed:
            `https://github.com/${{ github.repository }}/releases/latest/download/version.json`
